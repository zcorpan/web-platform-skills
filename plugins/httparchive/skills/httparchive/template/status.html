<!doctype html>
<!-- Run status for the user, gitignored. At each batch or phase end and whenever you stop for
     the user, update data-state (running, waiting or done), data-left (e.g. "about 2 h"), and
     the two fields. -->
<html data-state=running data-left="">
<meta charset=utf-8>
<meta name=viewport content="width=device-width">
<meta name=color-scheme content="light dark">
<meta http-equiv=refresh content=60>
<title>Run status</title>
<link rel=icon id=icon>
<style>body { font: 16px/1.5 system-ui; max-width: 40em; margin: 2em auto; padding: 0 1em }</style>
<h1 id=topic></h1>
<p><b id=banner></b>
<p><a href=README.md>README</a>
<p><b>Now:</b> kickoff
<p><b>So far:</b> nothing yet.
<script>
const {state, left} = document.documentElement.dataset;
// The repo's directory name, e.g. xslt-compat-11523
topic.textContent = decodeURIComponent(location.pathname.split('/').at(-2) || 'Run status');
const estimate = left.trim().replace(/\s*left$/, '');
let lead = {waiting: 'Waiting on you', done: 'Done'}[state] ?? (estimate ? `${estimate} left` : 'Running');
lead = lead[0].toUpperCase() + lead.slice(1);
const emoji = {waiting: '✋', done: '✅'}[state] ?? '⏳';
document.title = `${lead} · ${topic.textContent}`;
banner.textContent = `${emoji} ${lead}`;
icon.href = `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>${emoji}</text></svg>`;
</script>
